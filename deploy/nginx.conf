# avtoball.ru: статика текущей выкладки (/srv/current → releases/<sha>). Наружу – через общий Caddy.
server {
  listen 8080;
  server_name _;
  root /srv/current;
  absolute_redirect off;
  server_tokens off;
  charset utf-8;
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
  error_page 404 /404.html;
  location = /404.html { internal; }
}
